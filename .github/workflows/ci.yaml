name: CI Pipeline - Dev (Evolution)

on:
  push:
    branches: [dev]

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 : Build de l'image Docker
  # ─────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v3

      - name: Build image Docker (nginx:alpine3.23-slim)
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:latest .

      - name: Sauvegarder l'image Docker en tar
        run: |
          docker save ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:latest \
            -o intranet-newdeal.tar

      - name: Uploader l'image comme artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: intranet-newdeal.tar

  # ─────────────────────────────────────────────
  # JOB 2 : Scan sécurité (vulnérabilités + secrets)
  # BLOQUE si vulnérabilité CRITICAL détectée
  # ─────────────────────────────────────────────
  security-scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v3

      - name: Télécharger l'image Docker
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Charger l'image Docker
        run: docker load -i intranet-newdeal.tar

      - name: Installer Trivy
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -y
          sudo apt-get install -y trivy

      - name: Scan vulnérabilités — BLOQUER si CRITICAL
        run: |
          trivy image \
            --exit-code 1 \
            --severity CRITICAL \
            --no-progress \
            ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:latest

      - name: Scan vulnérabilités — rapport complet (info)
        if: always()
        run: |
          trivy image \
            --exit-code 0 \
            --severity LOW,MEDIUM,HIGH \
            --no-progress \
            ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:latest

      - name: Scan secrets dans le code source
        run: |
          trivy fs --scanners secret .

  # ─────────────────────────────────────────────
  # JOB 3 : Push vers Docker Hub
  # ─────────────────────────────────────────────
  push:
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Télécharger l'image Docker
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Charger l'image Docker
        run: docker load -i intranet-newdeal.tar

      - name: Login Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
            docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push image vers Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:latest

  # ─────────────────────────────────────────────
  # JOB 4 : Notification Email (succès ou échec)
  # ─────────────────────────────────────────────
  notify:
    runs-on: ubuntu-latest
    needs: [build, security-scan, push]
    if: always()  # S'exécute même si un job précédent a échoué
    steps:
      - name: Déterminer le statut global du pipeline
        id: status
        run: |
          if [[ "${{ needs.build.result }}" == "success" && \
                "${{ needs.security-scan.result }}" == "success" && \
                "${{ needs.push.result }}" == "success" ]]; then
            echo "status=✅ SUCCÈS" >> $GITHUB_OUTPUT
            echo "color=green" >> $GITHUB_OUTPUT
          else
            echo "status=❌ ÉCHEC" >> $GITHUB_OUTPUT
            echo "color=red" >> $GITHUB_OUTPUT
          fi

      - name: Envoyer notification email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_RECIPIENT }}
          from: "CI/CD Intranet NewDeal <${{ secrets.MAIL_USERNAME }}>"
          subject: |
            [CI Pipeline] ${{ steps.status.outputs.status }} — Branche dev — ${{ github.sha }}
          body: |
            Bonjour,

            Le pipeline CI (branche dev) vient de se terminer.

            ══════════════════════════════════════
            STATUT GLOBAL : ${{ steps.status.outputs.status }}
            ══════════════════════════════════════

            Détail des jobs :
              • Build        : ${{ needs.build.result }}
              • Security Scan: ${{ needs.security-scan.result }}
              • Push DockerHub: ${{ needs.push.result }}

            Informations du commit :
              • Branche   : ${{ github.ref_name }}
              • Commit    : ${{ github.sha }}
              • Auteur    : ${{ github.actor }}
              • Message   : ${{ github.event.head_commit.message }}

            Lien vers le pipeline :
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ──────────────────────────────────────
            Ministère de la Communication — Intranet NewDeal
            Pipeline CI/CD automatisé
