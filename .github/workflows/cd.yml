name: CD Pipeline - Prod

on:
  push:
    branches:
      - prod

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v3

      - name: Installer Trivy
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -y
          sudo apt-get install -y trivy

      - name: Scan vulnerabilites image
        run: |
          trivy image \
            --exit-code 1 \
            --severity CRITICAL \
            ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:latest

      - name: Scan secrets dans le code
        run: |
          trivy fs --scanners secret .

      - name: Notification echec scan
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ [CD] Vulnerabilite CRITICAL bloquee - intranet-newdeal"
          to: moussawade@groupeisi.com
          from: ${{ secrets.MAIL_USERNAME }}
          body: "Deploiement bloque en production : vulnerabilite CRITICAL detectee dans l'image Docker."

  deploy:
    runs-on: self-hosted
    needs: security-scan
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v3

      - name: Login Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Pull image Docker
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:latest

      - name: Arreter ancien container
        run: |
          docker stop intranet || true
          docker rm intranet || true

      - name: Deployer le container
        run: |
          docker run -d --name intranet -p 80:80 --restart always \
            ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:latest

      - name: Notification succes deploiement
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ [CD] Deploiement reussi - intranet-newdeal"
          to: moussawade@groupeisi.com
          from: ${{ secrets.MAIL_USERNAME }}
          body: "Le site Intranet New Deal a ete deploye avec succes en production sur le port 80."

      - name: Notification echec deploiement
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ [CD] Deploiement echoue - intranet-newdeal"
          to: moussawade@groupeisi.com
          from: ${{ secrets.MAIL_USERNAME }}
          body: "Le deploiement en production a echoue. Consultez GitHub Actions pour les details."
